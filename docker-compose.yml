
services:

  mongodb:
    image: mongo:8
    container_name: tribex-mongodb
    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8
    container_name: tribex-redis
    restart: always

    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: tribex-zookeeper

    restart: always

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: tribex-kafka

    restart: always

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui

    container_name: tribex-kafka-ui

    restart: always

    depends_on:
      - kafka

    ports:
      - "8090:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  auth-service:
    build:
      context: ./backend/auth-service

    container_name: tribex-auth-service

    restart: always

    depends_on:
      - kafka
      - redis

    ports:
      - "8081:8081"
    
    env_file:
      - ./backend/auth-service/.env

volumes:
  mongodb_data: